resources:
  jobs:
    lab001_setup_job:
      name: "Lab 001 — Environment setup"
      description: >-
        One-time environment setup job. Runs the DDL SQL scripts in
        src/ingestion, src/transformation and src/aggregation to create the
        Unity Catalog schemas and Delta tables required by the daily
        transformation and reporting batch jobs.

      tags:
        environment: ${bundle.target}
        purpose: environment-setup

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: bronze_schema
          default: ${bundle.target}_${workspace.current_user.short_name}_${var.bronze_schema}
        # - name: silver_schema
        #   default: ${bundle.var.silver_schema}
        # - name: gold_schema
        #   default: ${bundle.var.gold_schema}
        - name: edl_datatype_raw
          default: ${var.edl_datatype_raw}

      queue:
        enabled: true

      max_concurrent_runs: 1

      tasks:
        - task_key: ddl_bronze_transaction
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file: 
              path: ../src/ingestion/bronze_transactions.sql
            parameters:
              table_name: "{{job.parameters.catalog_name}}.{{job.parameters.bronze_schema}}.transactions"
              quarantine_table_name: "{{job.parameters.catalog_name}}.{{job.parameters.bronze_schema}}.transactions_quarantine"
              edl_datatype_raw: "{{job.parameters.edl_datatype_raw}}"


